# NookMux Docker Compose Configuration
#
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Uses SQLite (built-in) as the default database.
# To use an external database (PostgreSQL/MySQL), set SQL_DSN environment variable.

services:
  nookmux:
    image: ghcr.io/nookmux/nookmux:latest
    container_name: nookmux
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - REDIS_CONN_STRING=redis://:123456@redis:6379  # IMPORTANT: Change this password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
#      - SQL_DSN=postgres://root:123456@postgres:5432/nookmux    # Uncomment to use PostgreSQL
#      - SQL_DSN=mysql://root:123456@mysql:3306/nookmux          # Uncomment to use MySQL
#      - STREAMING_TIMEOUT=300
#      - SESSION_SECRET=random_string  # Multi-node deployment, must change this random string!
#      - SYNC_FREQUENCY=60
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nookmux-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # IMPORTANT: Change this password in production!
    networks:
      - nookmux-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  nookmux-network:
    driver: bridge
