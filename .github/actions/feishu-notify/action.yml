name: Feishu Notify
description: Send a Feishu interactive card for workflow results.

inputs:
  project_name:
    description: Repository name.
    required: true
  branch:
    description: Branch or tag name.
    required: true
  conclusion:
    description: Workflow conclusion.
    required: true
  app_id:
    description: Feishu app id.
    required: true
  app_secret:
    description: Feishu app secret.
    required: true
  user_id:
    description: Feishu recipient user id.
    required: true

runs:
  using: composite
  steps:
    - name: Send Feishu interactive card
      shell: bash
      env:
        CONCLUSION: ${{ inputs.conclusion }}
        REPO: ${{ inputs.project_name }}
        BRANCH: ${{ inputs.branch }}
        APP_ID: ${{ inputs.app_id }}
        APP_SECRET: ${{ inputs.app_secret }}
        USER_ID: ${{ inputs.user_id }}
      run: |
        set -euo pipefail

        if [ "$CONCLUSION" = "success" ]; then
          TEMPLATE_ID=AAqv27Ca6iyuE
        else
          TEMPLATE_ID=AAqv27ClgkT3l
        fi

        TIME_BJ=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')

        TOKEN_RESPONSE=$(mktemp)
        RESPONSE=$(mktemp)

        curl -sS -X POST \
          -H 'Content-Type: application/json' \
          -d "{\"app_id\":\"${APP_ID}\",\"app_secret\":\"${APP_SECRET}\"}" \
          https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal \
          -o "$TOKEN_RESPONSE"

        TOKEN=$(jq -r '.tenant_access_token // empty' "$TOKEN_RESPONSE")
        if [ -z "$TOKEN" ]; then
          CODE=$(jq -r '.code // empty' "$TOKEN_RESPONSE")
          MSG=$(jq -r '.msg // empty' "$TOKEN_RESPONSE")
          echo "Failed to fetch tenant_access_token. code=${CODE}, msg=${MSG}" >&2
          exit 1
        fi

        echo "::add-mask::${TOKEN}"

        CONTENT=$(jq -nc \
          --arg template_id "$TEMPLATE_ID" \
          --arg project_name "$REPO" \
          --arg branch "$BRANCH" \
          --arg time "$TIME_BJ" \
          '{
            type: "template",
            data: {
              template_id: $template_id,
              template_version_name: "1.0.1",
              template_variable: {
                Project_Name: $project_name,
                Branch: $branch,
                Time: $time
              }
            }
          }')

        PAYLOAD=$(jq -nc \
          --arg receive_id "$USER_ID" \
          --arg content "$CONTENT" \
          '{receive_id: $receive_id, msg_type: "interactive", content: $content}')

        echo "$PAYLOAD" | curl -sS -X POST \
          -H 'Content-Type: application/json; charset=utf-8' \
          -H "Authorization: Bearer ${TOKEN}" \
          --data-binary @- \
          "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=user_id" \
          -o "$RESPONSE"

        CODE=$(jq -r '.code // empty' "$RESPONSE")
        MSG=$(jq -r '.msg // empty' "$RESPONSE")
        if [ "$CODE" != "0" ]; then
          echo "Feishu API returned non-zero code: ${CODE}, msg: ${MSG}" >&2
          exit 1
        fi
