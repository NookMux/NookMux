name: Publish Docker image (multi-arch)

# 发布入口保持收口：CI 工作流（ci.yml）全绿后通过 workflow_dispatch 派发
# （见 ci.yml 的 trigger-docker job），或维护者手动触发。直接 push 不再
# 触发本工作流——所有提交必须先过 CI 门禁。
#
# 流水线分五段：
#   prepare           计算 GHCR 与 CNB 两侧的镜像名（同为小写 owner/repo）、
#                     渠道 tag（latest/beta/dev/test/<git tag>）、不可变 tag
#                     （YYYYMMDD-<sha7>）与构建矩阵
#   build_frontend    构建一次 web/dist（架构无关），经 artifact 分发给各架构
#                     构建 job，避免每个架构重复构建前端
#   build_single_arch 每架构独占一个 runner 并行构建，推送 per-arch tag
#                     （<tag>-amd64 / <tag>-arm64），GHA 缓存按架构分 scope
#   create_manifests  imagetools create 合成多架构 manifest，cosign 签名
#   sync_cnb          仅 dev 发布：先删除 CNB 上 dev 以外的历史标签，再用 skopeo
#                     把已签名的多架构 manifest 拷贝为 CNB 的 dev 标签并核对摘要，
#                     结束后单独发一张飞书卡片（notify_feishu_cnb）
#
# arm64 构建机：本仓库为公开仓库，默认使用免费的原生 arm64 runner
# （ubuntu-24.04-arm），无需 QEMU 模拟；若需回退 QEMU 模拟（例如仓库转
# 私有后失去原生 arm 配额），配置仓库
# Settings → Secrets and variables → Actions → Variables:
#   DOCKER_ARM64_QEMU_FALLBACK = true
#
# 供应链：per-arch 构建携带 provenance(mode=max) 与 SBOM attestation；
# imagetools create 合并时会保留两架构的 attestation 条目；cosign 无密签名
# 覆盖最终多架构 manifest 的 digest。
#
# CNB 镜像同步：CNB 的 Docker 制品库只放开发版，仅 dev 分支的发布会同步，且只
# 保留 dev 这一个标签，每次推送前先删除其余的历史标签。CNB 的 Docker 制品库
# 归属代码仓库，地址固定为 docker.cnb.cool/<小写 owner/repo>，要求 CNB 上存在
# 与本仓库同名的代码仓库；attestation 条目随清单一起拷贝，cosign 签名不在同步
# 范围内。所需仓库配置（Settings → Secrets and variables → Actions）：
#   Secrets → CNB_TOKEN = CNB 访问令牌：授权范围 registry-package 与
#              registry-package-delete 读写；使用范围选「指定仓库」时须勾上该
#              CNB 仓库；令牌账号在该仓库为管理员及以上（删除标签所需）
on:
  workflow_dispatch:

concurrency:
  # 同一 ref 上新的发布请求取代进行中的旧发布，避免旧提交的镜像覆盖新提交
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image: ${{ steps.vars.outputs.image }}
      cnb_image: ${{ steps.vars.outputs.cnb_image }}
      channel: ${{ steps.vars.outputs.channel }}
      tags_json: ${{ steps.vars.outputs.tags_json }}
      matrix_json: ${{ steps.vars.outputs.matrix_json }}

    steps:
      - name: Prepare image metadata
        id: vars
        shell: bash
        env:
          DOCKER_ARM64_QEMU_FALLBACK: ${{ vars.DOCKER_ARM64_QEMU_FALLBACK }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}"
          cnb_image="docker.cnb.cool/${repo}"
          immutable="$(date -u +'%Y%m%d')-${GITHUB_SHA::7}"

          ref="${GITHUB_REF}"
          case "$ref" in
            refs/tags/*)
              # tag 发布：镜像 tag 用 git tag 名（转小写），本身即不可变
              channel="${GITHUB_REF_NAME,,}"
              ;;
            refs/heads/main) channel="latest" ;;
            refs/heads/beta) channel="beta" ;;
            refs/heads/dev)  channel="dev"  ;;
            refs/heads/test) channel="test" ;;
            *)
              echo "::error::Unsupported ref '$ref'. Supported: main/beta/dev/test branches and tags."
              exit 1
              ;;
          esac

          # 每次发布额外打不可变 tag（YYYYMMDD-<sha7>），供精确回滚定位
          tags_json=$(jq -nc --arg channel "$channel" --arg immutable "$immutable" \
            '[$channel, $immutable]')

          if [ "${DOCKER_ARM64_QEMU_FALLBACK:-}" = "true" ]; then
            arm64_runner="ubuntu-latest"
            arm64_qemu=true
          else
            arm64_runner="ubuntu-24.04-arm"
            arm64_qemu=false
          fi

          matrix_json=$(jq -nc --arg arm64_runner "$arm64_runner" --argjson arm64_qemu "$arm64_qemu" \
            '{
              include: [
                {arch: "amd64", platform: "linux/amd64", runner: "ubuntu-latest", qemu: false},
                {arch: "arm64", platform: "linux/arm64", runner: $arm64_runner, qemu: $arm64_qemu}
              ]
            }')

          {
            echo "image=$image"
            echo "cnb_image=$cnb_image"
            echo "channel=$channel"
            echo "tags_json=$tags_json"
            echo "matrix_json=$matrix_json"
          } >> "$GITHUB_OUTPUT"

  build_frontend:
    name: Build frontend
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: VITE_REACT_APP_VERSION="${CHANNEL}" bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [prepare, build_frontend]
    strategy:
      # 单架构失败不取消另一架构，便于定位与部分产出；但 manifest 合成
      # 要求全部成功，避免 latest 被静默降级为单架构
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix_json) }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-web-dist
          path: web/dist

      - name: Set up QEMU
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Prepare per-arch tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "tags<<ARCH_TAGS_EOF"
            jq -r --arg image "$IMAGE" --arg suffix "-$ARCH" \
              '.[] | "\($image):\(.)\($suffix)"' <<< "$TAGS_JSON"
            echo "ARCH_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Output image tags
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "### Published image (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create manifests & sign
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
        run: |
          # tag 列表为空或非法时立即失败，避免循环零次迭代后仍显示成功
          jq -e 'type == "array" and length > 0' <<< "$TAGS_JSON" > /dev/null \
            || { echo "::error::tags_json is empty or not a JSON array" >&2; exit 1; }
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              -t "$IMAGE:$tag" \
              "$IMAGE:$tag-amd64" \
              "$IMAGE:$tag-arm64"
          done < <(jq -r '.[]' <<< "$TAGS_JSON")

      - name: Resolve final manifest digest
        id: digest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
        run: |
          primary_tag=$(jq -r '.[0]' <<< "$TAGS_JSON")
          # 所有 final tag 由相同 per-arch 源合成，指向同一 manifest，取其一即可
          digest=$(docker buildx imagetools inspect "$IMAGE:$primary_tag" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign multi-arch manifest with cosign
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Output manifest details
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          echo "### Published multi-arch manifests" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          jq -r --arg image "$IMAGE" '.[] | "\($image):\(.)"' <<< "$TAGS_JSON" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest contents:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  sync_cnb:
    name: Mirror dev to CNB
    needs: [prepare, create_manifests]
    # CNB 制品库只放开发版：仅 dev 分支的发布同步，其余分支与标签的发布不同步
    if: needs.prepare.outputs.channel == 'dev' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      # packages: 用 GITHUB_TOKEN 拉取 GHCR 上刚发布的 manifest
      packages: read

    env:
      CNB_REGISTRY: https://docker.cnb.cool
      CNB_API: https://api.cnb.cool

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB registry
        # CNB Docker 制品库固定以用户名 cnb + 访问令牌登录
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Prune stale CNB tags
        # 推送前清理历史：渠道标签本身保留、由推送覆盖，其余标签全部删除。
        # 令牌无删除权限或响应异常时立即失败，不带病推送
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_IMAGE: ${{ needs.prepare.outputs.cnb_image }}
          KEEP_TAG: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          repo="${CNB_IMAGE#*/}"
          package="${repo##*/}"

          # 用 CNB 登录凭据换 registry 的拉取令牌后列出全部标签；
          # 包尚不存在（404）时没有历史标签可删
          pull_token=$(curl -sS --connect-timeout 10 --max-time 60 -u "cnb:${CNB_TOKEN}" \
            "${CNB_REGISTRY}/service/token?service=cnb-registry&scope=repository:${repo}:pull" \
            | jq -r '.token // empty')
          [ -n "$pull_token" ] || { echo "::error::Failed to get a CNB registry token"; exit 1; }
          http=$(curl -sS --connect-timeout 10 --max-time 60 \
            -D tags_headers.txt -o tags.json -w '%{http_code}' \
            -H "Authorization: Bearer ${pull_token}" "${CNB_REGISTRY}/v2/${repo}/tags/list")
          # 200 必须是带 tags 字段的标签列表（数组或 null），404 必须是 registry 的
          # 错误信封。空响应体在个别 jq 版本上能通过 -e 校验，所以先单独判空
          case "$http" in
            200)
              if [ ! -s tags.json ] || ! jq -e 'has("tags") and (.tags == null or (.tags | type == "array"))' tags.json > /dev/null; then
                echo "::error::Unexpected tags response: $(cat tags.json)"
                exit 1
              fi ;;
            404)
              if [ ! -s tags.json ] || ! jq -e 'has("errors") and (.errors | type == "array")' tags.json > /dev/null; then
                echo "::error::Unexpected 404 response: $(cat tags.json)"
                exit 1
              fi ;;
            *) echo "::error::Failed to list CNB tags: HTTP ${http}, body: $(cat tags.json)"; exit 1 ;;
          esac
          # CNB registry 的标签列表支持分页（n / last 参数）。本仓库只保留 dev 一个
          # 标签，默认请求一次就能取全；万一响应带了下一页链接，说明标签数超出预期，
          # 不逐页删除，直接暴露
          if grep -qi -E '^link:.*rel="next"' tags_headers.txt; then
            echo "::error::CNB tags list is paginated; refusing to prune partially"
            exit 1
          fi

          echo "Tags on CNB: $(jq -r '(.tags // []) | join(" ")' tags.json)"
          deleted=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            encoded=$(printf '%s' "$tag" | jq -sRr @uri)
            http=$(curl -sS --connect-timeout 10 --max-time 60 -X DELETE \
              -o delete_response.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              "${CNB_API}/${repo}/-/packages/docker/${package}/-/tag/${encoded}")
            case "$http" in
              2*) echo "Deleted stale CNB tag: ${tag}"; deleted=$((deleted + 1)) ;;
              *) echo "::error::Failed to delete CNB tag ${tag}: HTTP ${http}, body: $(cat delete_response.json)"; exit 1 ;;
            esac
          done < <(jq -r --arg keep "$KEEP_TAG" '(.tags // [])[] | select(. != $keep)' tags.json)
          echo "Deleted ${deleted} stale tag(s); ${KEEP_TAG} is kept and replaced by the push."

      - name: Install skopeo
        # runner 官方 apt 源安装，签名校验由 apt 完成，无外部二进制下载
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Copy dev manifest from GHCR to CNB
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          CNB_IMAGE: ${{ needs.prepare.outputs.cnb_image }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          DIGEST: ${{ needs.create_manifests.outputs.digest }}
        run: |
          set -euo pipefail
          # 源端按摘要引用，拷贝的就是本次发布已签名的 manifest；--all 覆盖清单里
          # 的全部条目（两架构镜像与各自的 provenance / SBOM attestation）；
          # --preserve-digests 要求目标端各 manifest 摘要与源端一致，无法保持时
          # 直接报错。两步 docker login 的凭据都写在默认配置文件里，skopeo 复用
          authfile="${HOME}/.docker/config.json"
          echo "Copying ${IMAGE}@${DIGEST} -> ${CNB_IMAGE}:${CHANNEL}"
          skopeo copy \
            --all \
            --retry-times 5 \
            --preserve-digests \
            --src-authfile "$authfile" \
            --dest-authfile "$authfile" \
            "docker://${IMAGE}@${DIGEST}" "docker://${CNB_IMAGE}:${CHANNEL}"
          # 拷贝后摘要比对，确保 CNB 上的清单与已签名的 manifest 完全一致；
          # --no-tags：只需要清单摘要，不请求目标端的 tag 列表接口
          cnb_digest=$(skopeo inspect --no-tags --authfile "$authfile" \
            --format '{{.Digest}}' "docker://${CNB_IMAGE}:${CHANNEL}")
          if [ "$cnb_digest" != "$DIGEST" ]; then
            echo "::error::Digest mismatch for ${CNB_IMAGE}:${CHANNEL}: published=${DIGEST} cnb=${cnb_digest}"
            exit 1
          fi
          echo "Digest OK: ${CNB_IMAGE}:${CHANNEL} ${cnb_digest}"

      - name: Output CNB image
        env:
          CNB_IMAGE: ${{ needs.prepare.outputs.cnb_image }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          echo "### Mirrored to CNB" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${CNB_IMAGE}:${CHANNEL}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  notify_feishu:
    name: Notify Feishu
    needs: [prepare, build_frontend, build_single_arch, create_manifests]
    # 只反映镜像发布的结果，不等 CNB 同步；被取消的 run（concurrency 抢占）不打扰，
    # 上游任一失败都要通知
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'cancelled') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send Feishu notification
        uses: ./.github/actions/feishu-notify
        with:
          notify_type: docker
          workflow_name: ${{ github.workflow }}
          project_name: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          user_id: ${{ secrets.FEISHU_USER_ID }}

  notify_feishu_cnb:
    name: Notify Feishu (CNB)
    needs: sync_cnb
    # 仅在 CNB 同步实际运行过时发卡，结论取同步本身；上游失败连带跳过同步时
    # 不发，由发布卡片报告。被取消的 run（concurrency 抢占）不打扰
    if: ${{ always() && !cancelled() && needs.sync_cnb.result != 'skipped' }}
    continue-on-error: true
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send Feishu notification
        uses: ./.github/actions/feishu-notify
        with:
          notify_type: docker
          workflow_name: Sync dev image to CNB
          project_name: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          conclusion: ${{ needs.sync_cnb.result == 'success' && 'success' || 'failure' }}
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          user_id: ${{ secrets.FEISHU_USER_ID }}
