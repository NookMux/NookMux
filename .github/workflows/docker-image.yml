name: Publish Docker image (AMD64 only)

# 发布入口已收口为两个：CI 工作流（ci.yml）全绿后通过 workflow_dispatch
# 派发（见 ci.yml 的 trigger-docker job），或维护者手动触发。
# 直接 push 不再触发本工作流——所有提交必须先过 CI 门禁。
on:
  workflow_dispatch:

jobs:
  build_amd64:
    name: Build & push (amd64)
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine image tags
        id: tags
        run: |
          # Normalize repository name to lowercase
          GHCR_REPO="${GITHUB_REPOSITORY,,}"
          echo "GHCR_REPO=$GHCR_REPO" >> $GITHUB_ENV

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push: use tag name (lowercase)
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG,,}"
            echo "TAGS=ghcr.io/${GHCR_REPO}:${VERSION}" >> $GITHUB_OUTPUT
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "Building tag: $TAG -> $VERSION"

          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            # Main branch: tag as latest
            echo "TAGS=ghcr.io/${GHCR_REPO}:latest" >> $GITHUB_OUTPUT
            echo "VERSION=latest" >> $GITHUB_ENV
            echo "Building main branch -> latest"

          elif [[ "${{ github.ref }}" == refs/heads/beta ]]; then
            # Beta branch: tag as beta
            echo "TAGS=ghcr.io/${GHCR_REPO}:beta" >> $GITHUB_OUTPUT
            echo "VERSION=beta" >> $GITHUB_ENV
            echo "Building beta branch -> beta"

          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            # Dev branch: tag as dev
            echo "TAGS=ghcr.io/${GHCR_REPO}:dev" >> $GITHUB_OUTPUT
            echo "VERSION=dev" >> $GITHUB_ENV
            echo "Building dev branch -> dev"

          elif [[ "${{ github.ref }}" == refs/heads/test ]]; then
            # Test branch: tag as test
            echo "TAGS=ghcr.io/${GHCR_REPO}:test" >> $GITHUB_OUTPUT
            echo "VERSION=test" >> $GITHUB_ENV
            echo "Building test branch -> test"

          else
            echo "Unknown ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build frontend
        working-directory: web
        run: |
          bun install
          VITE_REACT_APP_VERSION="${VERSION}" bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ env.GHCR_REPO }}

      - name: Build & push (amd64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes ghcr.io/${GHCR_REPO}@${{ steps.build.outputs.digest }}

      - name: Output digest
        run: |
          echo "### Docker Image Digest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.TAGS }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  notify_feishu:
    name: Notify Feishu
    needs: [build_amd64]
    if: ${{ always() && (needs.build_amd64.result == 'success' || needs.build_amd64.result == 'failure') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send Feishu notification
        uses: ./.github/actions/feishu-notify
        with:
          project_name: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          conclusion: ${{ needs.build_amd64.result }}
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          user_id: ${{ secrets.FEISHU_USER_ID }}
